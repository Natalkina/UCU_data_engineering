services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node1
    environment:
      NODE_ID: "node1"
      PORT: "5000"
      PEERS: "node2=http://node2:5000,node3=http://node3:5000"
    ports:
      - "5001:5000"
    volumes:
      - .:/app

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node2
    environment:
      NODE_ID: "node2"
      PORT: "5000"
      PEERS: "node1=http://node1:5000,node3=http://node3:5000"
    ports:
      - "5002:5000"
    volumes:
      - .:/app

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node3
    environment:
      NODE_ID: "node3"
      PORT: "5000"
      PEERS: "node1=http://node1:5000,node2=http://node2:5000"
    ports:
      - "5003:5000"
    volumes:
      - .:/app
